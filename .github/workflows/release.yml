name: Release

# Runs when a merge to main changes pyproject.toml (every SDK update bumps the version there):
# builds and publishes celitech-sdk to PyPI, then creates the tag v<version> and the GitHub release.
# Same flow as the Postman workflow it replaces. Kept out of Fern's regeneration by .fernignore.
on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version
        id: pkg
        run: |
          name=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if curl -sf "https://pypi.org/pypi/${name}/${version}/json" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name} ${version} is already on PyPI; nothing to publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PYPI_API_TOKEN
        if: steps.pkg.outputs.published == 'false'
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::PYPI_API_TOKEN is not set"
            exit 1
          fi

      - name: Build distribution
        if: steps.pkg.outputs.published == 'false'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: steps.pkg.outputs.published == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Re-running on an already-published version is a no-op instead of a failure.
          skip-existing: true

      # Runs after a successful publish, and also when the version was already on PyPI but its
      # release is missing (e.g. a previous run stopped half-way). Creates the tag with the release.
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
